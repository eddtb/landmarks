# Workspace config for `maestro test .maestro/`.
#
# flows: only top-level YAMLs are runnable — subflows/ holds library
# files (setup/boot guards, scripts) that must never execute as flows
# of their own. Maestro doesn't recurse by default; this makes the
# exclusion explicit rather than incidental.
#
# executionOrder: one-door runs first (it IS the fresh-install path —
# clearState, dev-client relink, welcome mat, the door itself via
# `location: unset`). Since #307 no flow trusts launchApp's grant-all
# default for location: every flow declares its own standing — unset
# (one-door), never (sparse), inuse (the feed flows) — so no flow's
# state can leak into the next and each one names the contract it
# drives. The rest run in a fixed order so failures reproduce: without
# this the order is filesystem-dependent (observed non-alphabetical).
flows:
  - '*.yaml'
executionOrder:
  flowsOrder:
    - one-door
    - deeplink
    - lightbox
    - offline-stale
    - smoke
    - sparse
    - timeline
