# The one door, driven for real: `location: unset` resets the
# permission to UNDETERMINED (Maestro's documented reset state), and
# clearState wipes the "Not now" flag — a true fresh install, so the
# door itself must stand. Then "Not now" walks the never-asked journey
# #290 split off from refused: the unasked invitation, the in-app ask
# where iOS will still prompt, and the search waiting behind one word.
#
# This flow used to assert the DENIED banner instead, on the belief
# that Maestro could only set determined states; `unset` is documented
# now, so the door's own behaviour gets end-to-end coverage at last
# (unit coverage stays in src/__tests__/one-door-test.tsx). The
# determined-denied contract lives in sparse.yaml, which drives the
# refused remedy on the same suite run. If `unset` ever proves
# unsupported on an iOS target, fall back to `never` here and assert
# the refused banner — see sparse.yaml for its anchors.
#
# clearState also wipes the dev client's stored Metro URL, so the boot
# guards re-handle the relink.
appId: com.eddtb.landmarks
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- runFlow: subflows/setup.yaml

# Undetermined and undismissed: the door is the whole screen
- extendedWaitUntil:
    visible:
      id: 'one-door'
    timeout: 45000
- tapOn:
    id: 'one-door-not-now'

# Never-asked, and told the truth about it: the unasked invitation
# leads with the ask (iOS will still prompt), not with Settings
- extendedWaitUntil:
    visible: 'Venture hasn’t asked where you are yet'
    timeout: 20000
- assertNotVisible:
    id: 'one-door'
- assertVisible:
    id: 'ask-for-location'

# The field waits behind one word while the ask leads…
- assertNotVisible:
    id: 'place-search'
- tapOn:
    id: 'invitation-search-instead'
# …and one tap opens it
- assertVisible:
    id: 'place-search'
