# The smoke flow: launch → Nearby renders stories → open one → the
# story screen shows → History tab shows the gazetteer hero.
#
# `location: inuse` is explicit, not left to Maestro's grant-all
# default: since #307 the feed STANDS DOWN into an invitation when the
# app has no honest centre — the old flows only stayed green without a
# grant because the app fabricated a Charing Cross feed, and that bug
# is gone. A feed flow that doesn't declare its grant is trusting the
# previous flow not to have revoked it. The simulator's position is
# pinned to Greenwich by CI (and scripts/e2e-local.sh), so the granted
# permission resolves to a real fix and the fixture feed renders.
#
# Anchors are testIDs (stable), never story titles (data-dependent).
appId: com.eddtb.landmarks
---
- launchApp:
    permissions:
      location: inuse
# Dev-client link, dev-menu welcome mat — every flow must survive
# being the FIRST on a fresh install
- runFlow: subflows/setup.yaml

# Nearby: the list renders real story cards
- extendedWaitUntil:
    visible:
      id: 'history-card'
    timeout: 45000

# Open the first story and expect the story screen
# CI runners are slow: run 8's tap landed mid-settle (images decoding,
# layout moving) and was swallowed — the app never navigated. Let the
# frame settle first.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'history-card'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'story-screen'
    timeout: 20000
# iOS has no back button — the edge swipe is the back gesture
- swipe:
    start: 2%, 50%
    end: 90%, 50%

# History tab: the gazetteer hero appears
- runFlow: subflows/open-history-tab.yaml
- extendedWaitUntil:
    visible:
      id: 'gazetteer-hero'
    timeout: 45000
