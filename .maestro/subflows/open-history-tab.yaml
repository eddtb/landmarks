# The magic numbers, explained once: the floating tab pill ignores
# text taps intermittently (verifier's observation, confirmed 2/3
# local failures — PR #187), so the History tab is tapped by position.
# With the Quiz trigger hidden the pill holds three tabs and History
# is the rightmost: 80%, 94% is its measured centre on the simulator
# sizes we run (was 61% in the four-tab pill). Let the frame settle
# first — slow runners swallow taps that land mid-layout (run 8's
# failure mode).
appId: com.eddtb.landmarks
---
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: 80%, 94%
