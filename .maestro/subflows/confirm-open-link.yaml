# The deep-link doorman. iOS asks "Open in "Venture"?" before
# following a custom-scheme URL from outside the app, and the alert
# swallows every tap beneath it until answered. Nothing in the suite
# answered it, so from 22 July every nightly failed 7/7 — each flow on
# a different assertion, all of them waiting behind the same modal
# (run 30243457678's screenshot: the feed rendered perfectly, the
# alert sat on top of it).
#
# The runner's simulator runtime moved under us — the last green run
# drove iOS 18.5, which didn't prompt. Nothing in the app changed.
#
# Optional by construction: on a runtime that doesn't prompt, or when
# the alert has already been dismissed, this costs one invisible
# check. Guard on the title rather than the button — a bare "Open"
# could match app chrome one day, and Maestro text matches are
# FULL-STRING regexes, so the wildcards are load-bearing.
appId: com.eddtb.landmarks
---
# Wait for it BEFORE deciding. A bare `when: visible` guard checks the
# instant the link is fired and the alert arrives a beat later, so the
# check skips and the flow walks into the modal it just cleared itself
# to avoid — measured: with the one-shot guard, 5/7 flows recovered
# but the two that actually follow links (one-door's relink after
# clearState, deeplink's story links) still failed. This is the same
# race, and the same remedy, as the dev-menu welcome mat in boot.yaml:
# a bounded optional wait costs nothing when there is nothing to wait
# for, and is patient when there is.
- extendedWaitUntil:
    optional: true
    visible: 'Open in .*Venture.*'
    timeout: 8000
- runFlow:
    when:
      visible: 'Open in .*Venture.*'
    commands:
      - tapOn: 'Open'
      - waitForAnimationToEnd:
          timeout: 2000
