name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests PRs on temporary branches that emit
  # merge_group events — a required check that never runs there
  # would block the queue forever
  merge_group:
  # A manual re-run handle. The merge chain no longer dispatches CI —
  # it updates branches with a PAT, whose pushes fire the pull_request
  # run natively — but a human still needs a way to re-run main's
  # checks without pushing an empty commit
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This name is the string the protect-main ruleset requires, so it
    # is load-bearing and NOT free to edit — it now undersells the job,
    # which also bundles. Renaming it silently retires the only required
    # check and every PR merges unguarded, so the rename is a two-place
    # change (ruleset first, then here) and not worth doing for tidiness.
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts and .expo/types are gitignored; regenerate them for typecheck
      - name: Generate Expo types
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      # The only step that resolves the real module graph.
      #
      # Paid for on 2026-08-12 (#315): a merge deleted logo-glow.png and
      # left a require() of it in animated-icon.tsx. The app could not
      # bundle — `expo run:ios` died on it — and typecheck, lint and
      # 1,010 tests were all green, because tsc never resolves a
      # require() of a PNG, eslint has no opinion, and jest's
      # moduleNameMapper stubs anything under assets/ without looking.
      # Only Metro finds out, and Metro ran nowhere in CI. #315's
      # asset-references-test fenced the specific case; this fences the
      # class — any unresolvable import, bad path alias, broken @/
      # mapping, or platform-specific resolution failure.
      #
      # ios AND web, and neither is decoration. iOS is the binary and
      # every OTA. web is the API routes on EAS Hosting — the third
      # road, which reaches every client at once, binary or not — and
      # it is the only platform that resolves the .web.tsx/.web.ts
      # variants (animated-icon.web.tsx, use-color-scheme.web.ts) that
      # an iOS bundle never looks at. android is deliberately absent:
      # there is no .android.* file in the tree, no Android submit
      # profile in eas.json, and every .eas workflow — build, submit,
      # update — is platform: ios. Nothing Android ships, so nothing
      # Android is gated. Add `-p android` the day either changes.
      #
      # Keyless by construction: export bundles the route handlers, it
      # never runs them, so no TURSO_DATABASE_URL, no AI key and no
      # REPLAY_ONLY is needed for this to mean something. The one
      # outbound call export would otherwise make is CLI telemetry,
      # switched off below — the step touches the network not at all.
      #
      # --no-minify --no-bytecode buys back 42% of the runtime — 78s to
      # 45s on this runner — and costs nothing this step is for.
      # Resolution happens while Metro walks the graph; minification and
      # Hermes bytecode are serialisation of a bundle that has ALREADY
      # resolved. Every failing case below was re-proved with these
      # flags on and the errors are identical. The artifact is thrown
      # away — what ships is compiled properly by eas build.
      - name: Bundle (Metro resolves the real module graph)
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo export --output-dir "$RUNNER_TEMP/ci-bundle" \
            -p ios -p web --no-minify --no-bytecode

      # `shell: bash` is load-bearing, not decoration. The default `run:` shell
      # is `bash -e {0}` with NO pipefail, so a pipe reports tee's exit status
      # and jest's is discarded — this step, the ONLY required check, could not
      # fail on a red suite. `shell: bash` selects `bash -eo pipefail`.
      - name: Test
        shell: bash
        run: npm test -- --ci --coverage --coverageReporters=text --coverageReporters=text-summary | tee test-output.txt

      # Coverage is VISIBILITY, never a gate — a threshold would teach
      # us to write assertion-free tests that execute lines (Goodhart)
      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            sed -n '/^=* Coverage summary/,/^=*$/p' test-output.txt
            echo '```'
            echo '<details><summary>Per-file table</summary>'
            echo ''
            echo '```'
            grep '|' test-output.txt | head -100
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
